send_alarm_keystrokes:
  description: Sends keystrokes to the virtual keypad of an alarm control panel.
  fields:
    entity_id:
      description: Name(s) of the entities to send keystrokes to.
      example: "alarm_control_panel.partition_1"
    keystrokes:
      description: String of keystrokes.
      example: "*101#"
execute_macro:
  description: Execute a Composer macro by exact name.
  fields:
    macro_name:
      description: Composer macro name (must match Programming view).
      example: "AllOff"
      required: true
    config_entry_id:
      description: Control4 config entry id (required when multiple entries exist).
      example: "0123456789abcdef"
read_custom_variable:
  description: Read one Composer custom variable from the Variables agent.
  fields:
    variable_name:
      description: Exact custom variable name from Composer Programming.
      example: "DebugInt1"
      required: true
    config_entry_id:
      description: Control4 config entry id (required when multiple entries exist).
      example: "0123456789abcdef"
